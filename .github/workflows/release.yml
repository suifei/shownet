name: Quality and signed release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release for package.json version (vX.Y.Z)"
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Keep push CI and manual release dispatch from cancelling each other.
  group: shownet-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality / ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:release
      - run: npm run build
      - run: npm test
      # 360 assertions across three viewports in about three minutes. Added
      # after this suite — which had never run in CI — caught a real regression
      # the moment it was run by hand: a toolbar button whose label collapsed to
      # one character per line. The config starts its own dev server.
      - run: npx playwright install chromium
      - run: npm run test:browser
        id: browser-suite
      # Playwright writes an error context and a screenshot per failure, and
      # both were being thrown away with the runner. The one Windows failure so
      # far had to be diagnosed from console text alone.
      - if: failure() && steps.browser-suite.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Launches the installed Chrome through the production browser launcher,
      # then verifies it stays headless and applies page/request language.
      - run: npm run test:browser-launch
        timeout-minutes: 5
      # BoringSSL's x86_64 assembly is NASM syntax, so boring-sys cannot build on
      # Windows without it. Verified locally: the cross build fails with "No
      # CMAKE_ASM_NASM_COMPILER could be found" and succeeds once nasm is on
      # PATH. This step is what lets the impersonate build below run on both
      # runners rather than macOS only.
      - if: runner.os == 'Windows'
        name: Install NASM for BoringSSL
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
        shell: pwsh
      # The impersonate feature links a real BoringSSL connector, so this step
      # compiles boring-sys (vendored BoringSSL). It runs on both runners because
      # both now ship it: the release builds pass --features impersonate-boring,
      # so a break here is a break in what users get, not in an unused path.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features impersonate-boring
      # Its own crate, so the line above never reached it: the portable
      # launcher's test had never run in CI. It is what a Windows user
      # double-clicks, and its one test covers the layout decision that keeps
      # application and user data inside the portable root.
      - run: cargo test --manifest-path packaging/windows/launcher/Cargo.toml
      - run: npm run test:rust:network
      # Carries the feature for two reasons. It is what ships, so "the app
      # builds" should mean the shipped configuration builds. And the output
      # path is the same target/debug/shownet a developer runs locally — a
      # featureless build here silently replaces a feature build there, and the
      # two are indistinguishable by eye. That cost real debugging time.
      - run: npm run tauri -- build --debug --no-bundle -- --features impersonate-boring

  # ─── Release builds (tag v* or manual dispatch) ───────────────────────────
  release-macos:
    name: macOS release (aarch64)
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: quality
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install pinned Agent Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --target aarch64-apple-darwin
      # Real protoc on PATH — grok-build's vendored bin/protoc needs unavailable "dotslash"
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned Agent source for Rust cache
        run: node scripts/build-grok-sidecar.mjs --prepare-only --target aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/.sidecar-src/grok-build -> ../../.sidecar-target
      - run: npm ci
      - run: npm run check:release
      - name: Detect signing mode
        id: mode
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] \
            && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using Developer ID + notarization"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets incomplete — building ad-hoc (unsigned) macOS DMG"
          fi
      - name: Download ripgrep for Agent sidecar offline bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rg"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/rg/rg.tgz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz"
          tar -xzf "$RUNNER_TEMP/rg/rg.tgz" -C "$RUNNER_TEMP/rg"
          RG_BIN="$(find "$RUNNER_TEMP/rg" -type f -name rg | head -n 1)"
          test -x "$RG_BIN"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RG_BIN" >> "$GITHUB_ENV"
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          protoc --version
      - name: Build and verify built-in Agent sidecar
        run: |
          npm run build:agent-sidecar -- --target aarch64-apple-darwin
          npm run check:release -- --require-agent-target aarch64-apple-darwin
      - name: Build signed + notarized DMG
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --features impersonate-boring: without it the shipped binary cannot
        # honour the app's own impersonate setting. It was off here while the
        # setting was user-visible, so `impersonate: true` selected an engine no
        # release could provide and the egress silently stayed rustls — measured
        # on a real session as an outbound JA4 that never matched the browser's.
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.grok.conf.json -- --features impersonate-boring
      - name: Verify Apple signature and notarization ticket
        if: steps.mode.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Verify the app inside the dmg, not bundle/macos/ShowNet.app: with
          # --bundles dmg, tauri deletes that intermediate once the image is
          # built ("Cleaning .../ShowNet.app" in the log), so this step would
          # have failed on a missing path the first time signing was switched
          # on. The ad-hoc branch below reads the dmg for the same reason, and
          # that has run correctly in CI since 0.4.9.
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -quiet "$dmg_path" -mountpoint "$mount_point"
          # Detach whether verification passes or fails; the failure must still
          # fail the job, which a trap preserves and `&&` would not.
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          app_path="$mount_point/ShowNet.app"
          npm run verify:release:macos -- \
            --app "$app_path" \
            --dmg "$dmg_path" \
            --team-id "$APPLE_TEAM_ID" \
            --architecture arm64 \
            --report src-tauri/target/aarch64-apple-darwin/release/bundle/release-verification-macos.json
      # Do NOT export empty APPLE_CERTIFICATE here — Tauri still tries security import
      # when the var is present (even as ""), which breaks ad-hoc signingIdentity "-".
      - name: Build ad-hoc DMG (no Apple cert secrets)
        if: steps.mode.outputs.signed != 'true'
        run: |
          # Strip residual Apple signing env from the runner so ad-hoc identity "-" works.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH || true
          npm run tauri -- build --target aarch64-apple-darwin --bundles dmg \
            --config src-tauri/tauri.grok.conf.json \
            --config src-tauri/tauri.local.macos.conf.json \
            -- --features impersonate-boring
          mkdir -p src-tauri/target/aarch64-apple-darwin/release/bundle
          # Report what codesign found, not what this branch assumes. The signed
          # path writes this file from a real verification; this one used to
          # printf a constant, so a file named "verification" carried a claim
          # nobody had checked. Non-fatal: an unreadable signature is recorded as
          # "unknown" rather than failing a release over metadata.
          # Read the DMG, not bundle/macos/ShowNet.app: tauri deletes that
          # intermediate once the dmg is built ("Cleaning .../ShowNet.app" in the
          # log), so the first version of this inspected a path that no longer
          # existed and recorded "unknown". Mounting the artifact is also the
          # more honest check — it is what a user receives.
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          mount_point="$(mktemp -d)"
          signature="unknown"
          codesign_out=""
          if [ -n "$dmg_path" ] && hdiutil attach -nobrowse -quiet "$dmg_path" -mountpoint "$mount_point"; then
            codesign_out="$(codesign -dv --verbose=2 "$mount_point/ShowNet.app" 2>&1 || true)"
            hdiutil detach "$mount_point" -quiet || true
          fi
          if [ -n "$codesign_out" ]; then
            if printf '%s' "$codesign_out" | grep -q "Signature=adhoc"; then
              signature="ad-hoc"
            elif printf '%s' "$codesign_out" | grep -q "Signature="; then
              signature="signed"
            fi
          fi
          team="$(printf '%s' "${codesign_out:-}" | sed -n 's/^TeamIdentifier=//p' | head -1)"
          printf '%s\n' "{\"mode\":\"$signature\",\"architecture\":\"arm64\",\"teamIdentifier\":\"${team:-not set}\",\"note\":\"Built without APPLE_* secrets; mode read from codesign\"}" \
            > src-tauri/target/aarch64-apple-darwin/release/bundle/release-verification-macos.json
          cat src-tauri/target/aarch64-apple-darwin/release/bundle/release-verification-macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: shownet-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/release-verification-macos.json
          if-no-files-found: error

  release-windows:
    name: Windows release (x86_64 portable)
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # SignPath reads the workflow run and its artifacts to prove the binaries
      # it is asked to sign came from this commit on this repository.
      id-token: write
      actions: read
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned Agent Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --target x86_64-pc-windows-msvc
      # Real Win32 protoc — vendored bin/protoc in grok-build is not a valid Win32 app
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned Agent source for Rust cache
        run: node scripts/build-grok-sidecar.mjs --prepare-only --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/.sidecar-src/grok-build -> ../../.sidecar-target
      - run: npm ci
      - name: Detect signing mode
        id: mode
        shell: pwsh
        run: |
          npm run check:release
          # Signing goes through SignPath: since June 2023 a publicly trusted
          # code-signing key may not leave its hardware or cloud HSM, so there is
          # no PFX to import on the runner. SignPath holds the key and signs the
          # binaries we send it.
          $configured = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -eq 4) {
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Using SignPath Authenticode signing"
          } else {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "SignPath is not configured — building an unsigned portable ZIP"
          }
      - name: Download ripgrep for Agent sidecar offline bundle
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "rg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir "rg.zip"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $rg = Get-ChildItem -Path $dir -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $rg) { throw "rg.exe not found in ripgrep archive" }
          "GROK_TOOLS_BUNDLE_RG_PATH=$($rg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $protoc = (Get-Command protoc).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & protoc --version
      - name: Build and verify built-in Agent sidecar
        shell: pwsh
        run: |
          npm run build:agent-sidecar -- --target x86_64-pc-windows-msvc
          # Left unsigned here on purpose. Signing changes the bytes, and the
          # sidecar's recorded checksum has to describe the shipped file, so the
          # stamp is redone after SignPath returns.
          npm run check:release -- --require-agent-target x86_64-pc-windows-msvc
      # Same reason as the quality job: BoringSSL's x86_64 assembly is NASM
      # syntax, and the build below now compiles it.
      - name: Install NASM for BoringSSL
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Build application and launcher
        shell: pwsh
        run: |
          npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.grok.conf.json -- --features impersonate-boring
          $env:CARGO_TARGET_DIR = (Resolve-Path "src-tauri/target").Path
          cargo build --manifest-path packaging/windows/launcher/Cargo.toml --release --target x86_64-pc-windows-msvc

      # Signing has to land here, between compiling the executables and building
      # the package. The portable package records a checksum of every file it
      # contains, so signing afterwards would leave those checksums describing
      # bytes that no longer exist. verifyPortableChecksums re-hashes every file
      # during packaging and would fail this job — the guard is here in CI, not
      # on the user's machine, where the launcher checks nothing.
      - name: Collect executables for signing
        if: steps.mode.outputs.signed == 'true'
        shell: pwsh
        run: |
          $staging = "signing/unsigned"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $sources = @{
            "grok-build.exe"                 = "src-tauri/binaries/grok-build-x86_64-pc-windows-msvc.exe"
            "ShowNet.exe"                    = "src-tauri/target/x86_64-pc-windows-msvc/release/shownet.exe"
            "shownet-portable-launcher.exe"  = "src-tauri/target/x86_64-pc-windows-msvc/release/shownet-portable-launcher.exe"
          }
          foreach ($name in $sources.Keys) {
            $path = $sources[$name]
            if (-not (Test-Path $path)) { throw "Cannot sign a missing executable: $path" }
            Copy-Item $path (Join-Path $staging $name)
          }
          Compress-Archive -Path "$staging/*" -DestinationPath "signing/unsigned.zip" -Force
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.signed == 'true'
        id: unsigned
        with:
          name: shownet-windows-unsigned
          path: signing/unsigned.zip
          if-no-files-found: error
      - name: Sign with SignPath
        if: steps.mode.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signing/signed
      - name: Put the signed executables back
        if: steps.mode.outputs.signed == 'true'
        shell: pwsh
        run: |
          $archive = Get-ChildItem signing/signed -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $archive) { throw "SignPath returned no signed archive" }
          Expand-Archive -Path $archive.FullName -DestinationPath signing/extracted -Force
          $targets = @{
            "grok-build.exe"                = "src-tauri/binaries/grok-build-x86_64-pc-windows-msvc.exe"
            "ShowNet.exe"                   = "src-tauri/target/x86_64-pc-windows-msvc/release/shownet.exe"
            "shownet-portable-launcher.exe" = "src-tauri/target/x86_64-pc-windows-msvc/release/shownet-portable-launcher.exe"
          }
          foreach ($name in $targets.Keys) {
            $signed = Get-ChildItem signing/extracted -Recurse -Filter $name | Select-Object -First 1
            if (-not $signed) { throw "SignPath did not return $name" }
            # Refuse to ship anything the signing step did not actually sign.
            $signature = Get-AuthenticodeSignature $signed.FullName
            if ($signature.Status -ne "Valid") { throw "$name came back $($signature.Status)" }
            Copy-Item $signed.FullName $targets[$name] -Force
          }
          # The sidecar's bytes changed, so its recorded checksum must be redone
          # before anything reads it again.
          npm run build:agent-sidecar -- --target x86_64-pc-windows-msvc --stamp-only
          npm run check:release -- --require-agent-target x86_64-pc-windows-msvc
      - name: Build PortableApps package
        shell: pwsh
        env:
          SHOWNET_SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          npm run package:windows:portable -- --target x86_64-pc-windows-msvc
          $portableRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/ShowNetPortable"
          $executables = Get-ChildItem $portableRoot -Recurse -File -Filter *.exe
          if ($executables.Count -ne 3) { throw "Portable package must contain exactly three executables" }
          # Final check on what actually ships: every executable inside the
          # package must still carry a valid signature after packaging moved and
          # renamed it. A signed build that silently ships one unsigned binary
          # is worse than an unsigned build, because nobody looks again.
          if ($env:SHOWNET_SIGNED -eq "true") {
            foreach ($executable in $executables) {
              $signature = Get-AuthenticodeSignature $executable.FullName
              if ($signature.Status -ne "Valid") { throw "$($executable.Name) signature is $($signature.Status)" }
            }
          }
          # Report what Authenticode found, in both modes. The check above only
          # runs when signing was expected, so an unsigned build stated nothing
          # at all while macOS stated its mode — a user comparing the two
          # downloads had an answer for one and silence for the other. Read from
          # the executables that are about to be zipped, not from what this
          # branch assumes. Non-fatal: metadata must not fail a release.
          try {
            $statuses = [ordered]@{}
            foreach ($executable in $executables) {
              $statuses[$executable.Name] = (Get-AuthenticodeSignature $executable.FullName).Status.ToString()
            }
            $mode = if ($env:SHOWNET_SIGNED -eq "true") { "signed" } else { "unsigned" }
            $report = [ordered]@{
              mode = $mode
              architecture = "x86_64"
              executables = $statuses
              note = "Status read from Get-AuthenticodeSignature"
            }
            $reportPath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/release-verification-windows.json"
            $report | ConvertTo-Json -Depth 3 | Set-Content -Path $reportPath -Encoding utf8
            Get-Content $reportPath
          } catch {
            # Still write the file. The release notes tell users both platforms
            # ship one, and macOS always does — its failure path records
            # "unknown" rather than writing nothing. Skipping here would leave
            # the notes promising an attachment that is not there, and an absent
            # file says less than one that admits it could not tell.
            Write-Host "reading Authenticode failed, recording unknown: $_"
            $fallback = [ordered]@{
              mode = "unknown"
              architecture = "x86_64"
              executables = @{}
              note = "Get-AuthenticodeSignature failed: $_"
            }
            $fallbackPath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/release-verification-windows.json"
            $fallback | ConvertTo-Json -Depth 3 | Set-Content -Path $fallbackPath -Encoding utf8
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/ShowNetPortable_${version}_windows_x86_64.zip"
          Compress-Archive -Path $portableRoot -DestinationPath $archive -CompressionLevel Optimal -Force
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          # -NoNewline plus an explicit `n, because Set-Content's own terminator
          # is CRLF on Windows and this file is read by `shasum -a 256 -c` on
          # macOS and Linux, where the trailing CR becomes part of the filename:
          # v0.4.11 shipped a sidecar that answered "No such file or directory"
          # for the archive sitting right next to it.
          "$digest  $([IO.Path]::GetFileName($archive))`n" | Set-Content -Path "$archive.sha256" -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: shownet-windows-x86_64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*.zip.sha256
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/release-verification-windows.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release)) &&
      needs.release-macos.result == 'success' &&
      needs.release-windows.result == 'success'
    needs: [quality, release-macos, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: shownet-*
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag and assets
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match package.json version $version" >&2
              exit 1
            fi
          else
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -laR release-assets
          mac_name="$(find release-assets -type f -name '*.dmg' -printf '%f\n' | head -n 1)"
          win_name="$(find release-assets -type f -name '*.zip' -printf '%f\n' | head -n 1)"
          test -n "$mac_name"
          test -n "$win_name"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          mac_url="${release_base}/$(jq -rn --arg value "$mac_name" '$value|@uri')"
          win_url="${release_base}/$(jq -rn --arg value "$win_name" '$value|@uri')"
          # No latest.json: the app reads the GitHub release directly, so a second
          # statement of "what the latest version is" could only drift from it.
          echo "macOS asset:  $mac_url"
          echo "Windows asset: $win_url"
          # Name the files as they are published. The assets upload flattened
          # (files: release-assets/**/*), but the DMG arrives inside a dmg/
          # subdirectory, so the sums recorded ./dmg/ShowNet_x.y.z.dmg and
          # `shasum -a 256 -c SHA256SUMS.txt` in a download folder answered
          # "FAILED open or read" for the one artifact macOS users most need to
          # check. The hashes were right the whole time; the paths were not.
          (
            cd release-assets
            duplicates="$(find . -type f ! -name SHA256SUMS.txt -exec basename {} \; | sort | uniq -d)"
            if [ -n "$duplicates" ]; then
              echo "Assets share a basename and would collide once uploaded: $duplicates" >&2
              exit 1
            fi
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
              | sed -E 's#^([0-9a-f]{64}  )\./(.*/)?#\1#' > SHA256SUMS.txt
          )
      - name: Ensure git tag exists (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "ShowNet ${{ steps.meta.outputs.version }}"
            git push origin "$tag"
          fi
      - name: Render the release body
        shell: bash
        run: |
          set -euo pipefail
          # One source for this text: the standalone publish workflow renders the
          # same file, so the two cannot drift into telling users different things.
          sed "s/{{VERSION}}/${{ steps.meta.outputs.version }}/g" \
            .github/release/body.md > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ShowNet ${{ steps.meta.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
