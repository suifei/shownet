# Publish a release from artifacts a previous run already produced.
#
# The build jobs take close to two hours, and their output is uploaded as
# workflow artifacts before anything is published. When the publish step fails on
# its own — a GitHub service blip during `Set up job` cost one release exactly
# that way — rebuilding is pure waste: the binaries already exist and are already
# the ones that were tested. This takes them and publishes.
name: Publish from an existing run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID whose artifacts to publish (from the Actions URL)"
        required: true
        type: string
      tag:
        description: "Release tag, e.g. v0.3.0. Must match package.json at that tag."
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Check the tag matches the version it claims
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${{ inputs.tag }}" != "v${version}" ]]; then
            echo "Tag ${{ inputs.tag }} does not match package.json version ${version} at that tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: shownet-*
          path: release-assets
          merge-multiple: true
          # Reach into the build run rather than this one.
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the artifacts belong to this release
        shell: bash
        run: |
          set -euo pipefail
          ls -laR release-assets
          # Publishing one version's binaries under another version's tag would
          # hand users a download that silently does not match what they clicked.
          mac="$(find release-assets -type f -name '*.dmg' -printf '%f\n' | head -n 1)"
          win="$(find release-assets -type f -name '*.zip' -printf '%f\n' | head -n 1)"
          test -n "$mac" || { echo "no macOS DMG in run ${{ inputs.run_id }}" >&2; exit 1; }
          test -n "$win" || { echo "no Windows ZIP in run ${{ inputs.run_id }}" >&2; exit 1; }
          for name in "$mac" "$win"; do
            case "$name" in
              *"${version}"*) ;;
              *) echo "asset ${name} is not version ${version}" >&2; exit 1 ;;
            esac
          done
          # Same shape as release.yml: publish names, not the paths the assets
          # happen to be downloaded into, or `shasum -c` cannot find the DMG.
          (
            cd release-assets
            duplicates="$(find . -type f ! -name SHA256SUMS.txt -exec basename {} \; | sort | uniq -d)"
            if [ -n "$duplicates" ]; then
              echo "Assets share a basename and would collide once uploaded: $duplicates" >&2
              exit 1
            fi
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
              | sed -E 's#^([0-9a-f]{64}  )\./(.*/)?#\1#' > SHA256SUMS.txt
          )
      - name: Render the release body
        shell: bash
        run: sed "s/{{VERSION}}/${version}/g" .github/release/body.md > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ShowNet ${{ env.version }}
          body_path: release-body.md
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
